[project]
name = "nexus-facility-report"
version = "1.0.0"
description = "Nexus Hub facility maintenance reporting application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.12,<1.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "npm install --no-audit --no-fund && npm run build"
